# Interaction definition manifest — tangent.whiteboard@0.4
#
# Authored per docs/adr/0003-definition-and-package-ownership.md §2. Every field
# below is publisher-authored; Tangent derives the digests, the granted
# capabilities, and the effective trust assurance and refuses a manifest that
# tries to author them.
#
# ADR 0003 §6 T3: a presentation surface Tangent hosts inside its own tree.
#
# Compatibility defaults under ADR 0003 §8 C4 — what the code actually does,
# never something more permissive:
#
#   * response_schema is absent. ADR 0003 §9 S2 backfills it per kind from the
#     handler's real behaviour during CW-20260825-0074; declaring `absent`
#     preserves today's response-kind-only check rather than pretending a
#     schema exists and starting to reject responses production accepts.
#   * required_capabilities is empty. Nothing in this kind is capability-
#     mediated today, and CW-20260825-0077 is what authors real grants.
#   * retention_class is deliberately UNAUTHORED, so ADR 0002 §4's host default
#     (interaction, redacted 30 days after terminal) governs new interactions
#     while existing rows keep `surface` under ADR 0002 §12. Authoring
#     `surface` here would re-loosen, through the min() in ADR 0002 §3, exactly
#     the default ADR 0002 tightened.
# draft_custody: browser-local is a truthful description of the existing
# ui/src/lib/whiteboard-draft-storage.ts module (ADR 0003 §8 C4), not a grant.
# Effective browser persistence still derives from ADR 0002 §5.

manifest_version: "1.0.0"
publisher: tangent
kind: tangent.whiteboard
version: "0.4"
revision: 1
title: "Whiteboard"
description: "Whiteboard envelope: present a tldraw-backed board with persisted room snapshot hydration and a full-scene submit response."
package_id: tangent.canvas
package_version: "1.0.0"
ownership_class: host-package

request_schema: request.schema.json
response_kind: data
compatibility_response_schema: absent

renderer:
  id: tangent.renderer.whiteboard
  class: react-component
  entry: "components/envelopes/Whiteboard#Whiteboard"
  trust_class: portfolio-trusted
  component: WhiteboardView
  fallback:
    preserves_meaning: false
    degradation: none

compatible_host_versions: ">=0.12.0 <1.0.0"
compatible_protocol_versions: ">=1 <2"
compatibility_class: additive

required_capabilities: []

draft_custody: browser-local
sensitivity_default: normal
inline_payload_limit_bytes: 262144
client_persistence_prohibited: false

trust:
  assurance: content-addressed-registry

telemetry:
  emits: []
  redact_fields: []
  opt_in: true
