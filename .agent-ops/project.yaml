project:
  id: tangent
  display_name: Tangent
  status: active
  purpose: |
    Tangent is an agent-summoned, app-sized interactive surface: a single
    localhost binary that any MCP-speaking agent can summon when chat is the
    wrong shape for the work — diff-approval queues, design-comp triage,
    screenshot annotation, persistent forms, spreadsheet review, guided
    wizards, and similar workflows. It is Mode 1 (the separate-window app
    surface) of the interactive-collaboration-system idea, driven by the
    Envelope UI Protocol over a shared envelope schema. Tangent absorbed and
    superseded the earlier Fast-Triage project.
catalog:
  torque_project_id: PRJ-20260825-0002
  cerberus_project_id: tangent     # SoT: ~/.cerberus/projects/tangent.cerberus.yaml (indexed by ~/.cerberus/registry.yaml)
  tether_catalog_project: null     # no launch-project entry by design; the MCP upstream is ~/.tether/catalog/mcp-servers/tangent.yaml
locations:
  repo: ~/dev/hollis-labs/apps/tangent
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/tangent
  state_dir: ~/.tangent            # STABLE state; the dev instance uses <repo>/.tangent/dev.db (gitignored)
  dev_state_dir: ~/dev/hollis-labs/apps/tangent/.tangent
  catalog: null                    # no per-project catalog dir; tangent uses no ~/.tangent/catalog
  artifacts: null                  # dev_session runs from the workspace; no ~/.cerberus/apps artifact is installed
build:
  authority: cerberus              # launch authority of the DEV instance — see docs/mcp-integration.md "Managed runtime"
  resource: tangent-dev            # cerberus resource id; mode dev_session, run_from workspace
  command: 'make build'            # cerberus drives this via build_strategy: make_standard
deployment:
  # Two instances by design (CW-20260907-0018, plan CW-20260907-0014 decision 1).
  # `current` says what is true on this machine as of the 2026-09-07 cutover
  # (CW-20260907-0020). Agents reach `tangent` (7842, stable) through the
  # shared Tether catalog. `tangent-dev` (7843) exists in the catalog but
  # MUST stay `enabled: false` there: two upstreams with identical tool names
  # make mux hand the bare `tangent.*` names to one and rename the other's
  # (CW-20260907-0037), which routed a default-config session's HITL item to
  # dev. Reach dev through a scratch catalog copy or `mux mcp --proxy --only
  # tangent-dev`, never the shared catalog, until Tether namespaces duplicates.
  type: dev_session                # the live Cerberus resource today; see instances.current
  service_name: null
  binary: ~/dev/hollis-labs/apps/tangent/tangent   # workspace build output; `go install` also puts a copy on $GOBIN
  instances:
    current:
      note: since 2026-09-07 stable runs under launchd on 7842 (~/.local/bin/tangent, Tangent.app in ~/Applications); dev runs on 7843 against <repo>/.tangent/dev.db, started by hand until the Cerberus daemon is restarted to re-read the 7843 spec (CW-20260907-0036) — no Cerberus lifecycle verb may target tangent-dev before that
    stable:
      port: 7842
      state: ~/.tangent/tangent.db
      authority: launchd           # com.hollislabs.tangent LaunchAgent, headless daemon (docs/launch-at-login.md); installed by CW-20260907-0020, not yet
      catalog_entry: tangent       # ~/.tether/catalog/mcp-servers/tangent.yaml; what agents reach by default
    dev:
      port: 7843
      state: ~/dev/hollis-labs/apps/tangent/.tangent/dev.db
      authority: cerberus          # resource tangent-dev (live file = packaging/cerberus/tangent.cerberus.yaml) once the daemon registry is reconciled (CW-20260907-0036); hand-run meanwhile
      catalog_entry: tangent-dev   # ~/.tether/catalog/mcp-servers/tangent-dev.yaml; present, DISABLED in the shared catalog (CW-20260907-0037); use a scratch catalog or --only tangent-dev
      make_targets: dev, dev-go, db-migrate, db-rollback, smoke (DEV_PORT, DEV_DB_PATH)
docs:
  readme: README.md
  architecture: docs/architecture.md
  adrs: docs/adr/
  roadmap: null                    # no docs/roadmap.md; roadmap lives inline in README.md
roadmap:
  current_phase: 'v0.12 — Wizard (CHANGELOG/README declare v0.12.0; latest git tag is v0.11.0 — v0.12.0 is untagged); v0.8+ distribution & trust pending'
  pointer: null                    # no sprint/clockwork pointer recorded
usage_examples:
  - intent: Check or restart the managed Tangent process
    command: 'cerberus resource status tangent-dev'
    note: Cerberus owns the DEV lifecycle (stable is launchd). Until the daemon registry is reconciled (CW-20260907-0036) its port spec is stale and stop/reload/deploy would signal the STABLE daemon; do not run them. `deploy` also needs the pinned Node on Cerberus's PATH (CW-20260905-0017).
  - intent: Run Tangent standalone (no Cerberus on this machine)
    command: 'make build && ./tangent'
    note: Serves http://localhost:7842/ against ~/.tangent (the STABLE defaults); override with TANGENT_HTTP_PORT and TANGENT_DB_PATH. Only valid when nothing else supervises the process.
  - intent: Run the DEV instance by hand, beside stable
    command: 'make build && make dev-go'
    note: DEV_PORT (7843) and DEV_DB_PATH (<repo>/.tangent/dev.db) keep it off stable's port, database and flock.
  - intent: Reach Tangent from a mux-speaking agent
    command: 'mux_discover intent="triage" then mux_call tangent.triage'
    note: Upstream declared in ~/.tether/catalog/mcp-servers/tangent.yaml (SSE at /sse); mux exposes tangent as proxy_only.
  - intent: Develop the frontend with hot reload
    command: 'make dev'
    note: Go DEV server on :7843 (DEV_PORT) with the workspace database reverse-proxies non-API routes to Vite on :5173.
  - intent: Regenerate envelope TypeScript types after a go-envelopes bump
    command: 'make generate-envelopes'
    note: CI gates on staleness via `make check-envelopes`; the generated file is committed.
scopes:
  - tangent.backend.main
  - tangent.frontend.main
related_projects: [go-envelopes, nanite, sigil, go-plugin]   # fast-triage retired; repo archived and its catalog entry removed
