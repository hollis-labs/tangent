project:
  id: tangent
  display_name: Tangent
  status: active
  purpose: |
    Tangent is an agent-summoned, app-sized interactive surface: a single
    localhost binary that any MCP-speaking agent can summon when chat is the
    wrong shape for the work — diff-approval queues, design-comp triage,
    screenshot annotation, persistent forms, spreadsheet review, guided
    wizards, and similar workflows. It is Mode 1 (the separate-window app
    surface) of the interactive-collaboration-system idea, driven by the
    Envelope UI Protocol over a shared envelope schema. Tangent absorbed and
    superseded the earlier Fast-Triage project.
catalog:
  torque_project_id: PRJ-20260825-0002
  cerberus_project_id: tangent     # SoT: ~/.cerberus/projects/tangent.cerberus.yaml (indexed by ~/.cerberus/registry.yaml)
  tether_catalog_project: null     # no launch-project entry by design; the MCP upstream is ~/.tether/catalog/mcp-servers/tangent.yaml
locations:
  repo: ~/dev/hollis-labs/apps/tangent
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/tangent
  state_dir: ~/.tangent
  catalog: null                    # no per-project catalog dir; tangent uses no ~/.tangent/catalog
  artifacts: null                  # dev_session runs from the workspace; no ~/.cerberus/apps artifact is installed
build:
  authority: cerberus              # single launch authority — see docs/mcp-integration.md "Managed runtime"
  resource: tangent-dev            # cerberus resource id; mode dev_session, run_from workspace, port 7842
  command: 'make build'            # cerberus drives this via build_strategy: make_standard
deployment:
  type: dev_session                # Cerberus-supervised localhost process; no launchd job exists for Tangent
  service_name: null
  binary: ~/dev/hollis-labs/apps/tangent/tangent   # workspace build output; `go install` also puts a copy on $GOBIN
docs:
  readme: README.md
  architecture: docs/architecture.md
  adrs: docs/adr/
  roadmap: null                    # no docs/roadmap.md; roadmap lives inline in README.md
roadmap:
  current_phase: 'v0.12 — Wizard (CHANGELOG/README declare v0.12.0; latest git tag is v0.11.0 — v0.12.0 is untagged); v0.8+ distribution & trust pending'
  pointer: null                    # no sprint/clockwork pointer recorded
usage_examples:
  - intent: Check or restart the managed Tangent process
    command: 'cerberus resource status tangent-dev'
    note: Cerberus owns the lifecycle. Use `cerberus resource deploy tangent-dev` to rebuild and restart; do not launch ./tangent by hand while the resource is running.
  - intent: Run Tangent standalone (no Cerberus on this machine)
    command: 'make build && ./tangent'
    note: Serves http://localhost:7842/; override port with TANGENT_HTTP_PORT. Only valid when nothing else supervises the process.
  - intent: Reach Tangent from a mux-speaking agent
    command: 'mux_discover intent="triage" then mux_call tangent.triage'
    note: Upstream declared in ~/.tether/catalog/mcp-servers/tangent.yaml (SSE at /sse); mux exposes tangent as proxy_only.
  - intent: Develop the frontend with hot reload
    command: 'make dev'
    note: Go server on :7842 reverse-proxies non-API routes to Vite on :5173.
  - intent: Regenerate envelope TypeScript types after a go-envelopes bump
    command: 'make generate-envelopes'
    note: CI gates on staleness via `make check-envelopes`; the generated file is committed.
scopes:
  - tangent.backend.main
  - tangent.frontend.main
related_projects: [go-envelopes, nanite, sigil, go-plugin]   # fast-triage retired; repo archived and its catalog entry removed
