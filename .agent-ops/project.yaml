project:
  id: tangent
  display_name: Tangent
  status: active
  purpose: |
    Tangent is an agent-summoned, app-sized interactive surface: a single
    localhost binary that any MCP-speaking agent can summon when chat is the
    wrong shape for the work — diff-approval queues, design-comp triage,
    screenshot annotation, persistent forms, spreadsheet review, guided
    wizards, and similar workflows. It is Mode 1 (the separate-window app
    surface) of the interactive-collaboration-system idea, driven by the
    Envelope UI Protocol over a shared envelope schema. Tangent absorbed and
    superseded the earlier Fast-Triage project.
catalog:
  torque_project_id: PRJ-20260825-0002
  cerberus_project_id: tangent     # ~/.cerberus/projects/tangent.cerberus.yaml
  tether_catalog_project: null     # no launch-project entry; MCP upstream is mcp-servers/tangent.yaml
locations:
  repo: ~/dev/hollis-labs/apps/tangent
  agent_os_tracking: ~/dev/agent-os/workspaces/execution/tangent
  state_dir: ~/.tangent
  catalog: null                    # no per-project catalog dir; tangent uses no ~/.tangent/catalog
  artifacts: null                  # dev_session resource runs from the workspace; no installed artifact
build:
  authority: cerberus
  resource: tangent-dev
  command: 'make build'
deployment:
  type: dev_session                # Cerberus-managed localhost process on port 7842
  service_name: null
  binary: ~/dev/hollis-labs/apps/tangent/tangent   # local build output; installed copy lands on $GOBIN via `go install`
docs:
  readme: README.md
  architecture: docs/architecture.md
  adrs: null                       # no docs/adrs/ directory exists
  roadmap: null                    # no docs/roadmap.md; roadmap lives inline in README.md
roadmap:
  current_phase: 'v0.12 — Wizard (latest tag v0.12.0); v0.8+ distribution & trust pending'
  pointer: null                    # no sprint/clockwork pointer recorded
usage_examples:
  - intent: Run Tangent locally for an agent to summon workflow windows
    command: 'make build && ./tangent'
    note: Serves http://localhost:7842/; override port with TANGENT_HTTP_PORT.
  - intent: Expose Tangent through the Tether MCP gateway
    command: 'mux mcp --proxy'
    note: Uses ~/.tether/catalog/mcp-servers/tangent.yaml and Tangent's legacy SSE endpoint at /sse.
  - intent: Develop the frontend with hot reload
    command: 'make dev'
    note: Go server on :7842 reverse-proxies non-API routes to Vite on :5173.
  - intent: Regenerate envelope TypeScript types after a go-envelopes bump
    command: 'make generate-envelopes'
    note: CI gates on staleness via `make check-envelopes`; the generated file is committed.
scopes:
  - tangent.backend.main
  - tangent.frontend.main
related_projects: [go-envelopes, nanite, fast-triage, sigil, go-plugin]
