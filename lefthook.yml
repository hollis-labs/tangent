# lefthook.yml — Tangent pre-commit/pre-push hooks.
#
# Lifted from the Fragments Engine portfolio shape (see Nanite's
# lefthook.yml). Trimmed for v0.1: no migration-DDL purity check, no
# plugin signature checks. Aim: every gate completes in <15s on staged
# files.

pre-commit:
  parallel: true
  commands:

    # ── Go parallel group ─────────────────────────────────────────────

    go-format:
      glob: "*.go"
      skip_empty: true
      run: |
        unformatted=$(gofmt -l {staged_files} 2>/dev/null)
        if command -v goimports >/dev/null 2>&1; then
          unformatted="$unformatted$(goimports -l {staged_files} 2>/dev/null)"
        fi
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted" | sort -u
          exit 1
        fi

    go-lint:
      glob: "*.go"
      skip_empty: true
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          # cmd/tangent-app and internal/appshell link Wails (GTK/webkit via pkg-config) on
          # Linux; without pkg-config they cannot typecheck, so skip just those two (CI lints
          # them). Capture `go list` first so its failure fails the hook instead of leaving a
          # partial list.
          if [ "$(uname -s)" = Linux ] && ! command -v pkg-config >/dev/null 2>&1; then
            dirs=$(go list -f '{{.Dir}}' ./...) || exit 1
            dirs=$(printf '%s\n' "$dirs" | grep -v -e '/cmd/tangent-app$' -e '/internal/appshell$')
            golangci-lint run --new --timeout 30s $dirs
          else
            golangci-lint run --new --timeout 30s
          fi
        else
          echo "golangci-lint not installed — skipping"
        fi

    go-vet:
      glob: "*.go"
      skip_empty: true
      # Same Linux/pkg-config exclusion as go-lint above; CI vets the full tree.
      run: |
        if [ "$(uname -s)" = Linux ] && ! command -v pkg-config >/dev/null 2>&1; then
          pkgs=$(go list ./...) || exit 1
          pkgs=$(printf '%s\n' "$pkgs" | grep -v -e '/cmd/tangent-app$' -e '/internal/appshell$')
          go vet $pkgs
        else
          go vet ./...
        fi

    # ── Frontend ──────────────────────────────────────────────────────

    frontend-lint:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      skip_empty: true
      # {staged_files} are repo-root-relative, but biome runs from ui/ (where its config
      # lives): keep only ui/ files and strip the prefix, or biome sees paths like
      # ui/ui/src/... and checks nothing. No --no-errors-on-unmatched: a file list that
      # matches nothing is a bug here and must fail.
      run: |
        files=$(printf '%s\n' {staged_files} | sed -n 's|^ui/||p')
        [ -z "$files" ] && exit 0
        cd ui && npx biome check $files
      skip:
        - run: "test ! -d ui"

pre-push:
  commands:

    go-test:
      glob: "*.go"
      skip_empty: true
      # cmd/tangent-app and internal/appshell link Wails (GTK/webkit via pkg-config) on
      # Linux. Without pkg-config they cannot build, so skip just those two packages; CI
      # runs the full suite. Elsewhere, or with pkg-config present, test everything.
      run: |
        if [ "$(uname -s)" = Linux ] && ! command -v pkg-config >/dev/null 2>&1; then
          echo "pkg-config not found: skipping cmd/tangent-app and internal/appshell (CI runs them)"
          pkgs=$(go list ./...) || exit 1
          pkgs=$(printf '%s\n' "$pkgs" | grep -v -e '/cmd/tangent-app$' -e '/internal/appshell$')
          go test -race $pkgs
        else
          go test -race ./...
        fi
