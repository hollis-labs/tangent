# lefthook.yml — Tangent pre-commit/pre-push hooks.
#
# Lifted from the Fragments Engine portfolio shape (see Nanite's
# lefthook.yml). Trimmed for v0.1: no migration-DDL purity check, no
# plugin signature checks. Aim: every gate completes in <15s on staged
# files.

pre-commit:
  parallel: true
  commands:

    # ── Go parallel group ─────────────────────────────────────────────

    go-format:
      glob: "*.go"
      skip_empty: true
      run: |
        unformatted=$(gofmt -l {staged_files} 2>/dev/null)
        if command -v goimports >/dev/null 2>&1; then
          unformatted="$unformatted$(goimports -l {staged_files} 2>/dev/null)"
        fi
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted" | sort -u
          exit 1
        fi

    go-lint:
      glob: "*.go"
      skip_empty: true
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run --new --timeout 30s
        else
          echo "golangci-lint not installed — skipping"
        fi

    go-vet:
      glob: "*.go"
      skip_empty: true
      run: go vet ./...

    # ── Frontend ──────────────────────────────────────────────────────

    frontend-lint:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      skip_empty: true
      # {staged_files} are repo-root-relative, but biome runs from ui/ (where its config
      # lives): keep only ui/ files and strip the prefix, or biome sees paths like
      # ui/ui/src/... and checks nothing. No --no-errors-on-unmatched: a file list that
      # matches nothing is a bug here and must fail.
      run: |
        set --
        for file in {staged_files}; do
          case "$file" in ui/*) set -- "$@" "${file#ui/}" ;; esac
        done
        [ $# -eq 0 ] && exit 0
        cd ui && npx biome check "$@"
      skip:
        - run: "test ! -d ui"

pre-push:
  commands:

    go-test:
      glob: "*.go"
      skip_empty: true
      # Focused: the packages this push changes, with -p 2 and a per-package
      # timeout. The full `go test -race ./...` starts one race binary per CPU
      # at once and internal/mcp alone outran the default 10m timeout on busy
      # hosts. CI is the full gate; TANGENT_PREPUSH_FULL=1 runs everything
      # locally. See scripts/pre-push-go-test.sh for the knobs.
      run: scripts/pre-push-go-test.sh
