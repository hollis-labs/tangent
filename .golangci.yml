# Tangent golangci-lint config (v2 format).
#
# Trimmed from the Fragments Engine portfolio config (see Nanite's
# .golangci.yml). v0.1 keeps the high-signal linters and drops the
# Wave-1 adoption-surfacing rules (forbidigo for AtomicWriteFile /
# ResolveUnder) — those primitives don't exist here yet.

version: "2"

run:
  go: "1.26"

linters:
  default: none
  enable:
    # Essential — catch real bugs.
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

    # Security.
    - gosec

    # Style — minimal; errors only, not opinions.
    - revive
    - misspell
    - unconvert
    - unparam

    # Correctness.
    - errorlint
    - nilerr

  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Println
        - fmt.Printf
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf

    gosec:
      excludes:
        # G104: covered by errcheck; double-reporting is noise.
        - G104

    govet:
      enable-all: true
      disable:
        - fieldalignment

    misspell:
      locale: US
      ignore-rules:
        # NOT go-envelopes compatibility any more. CW-20260904-0168 finished
        # that migration: the protocol's British constants are referenced
        # nowhere, and nothing here emits or persists "user-cancelled".
        #
        # The rule survives because "cancelled" is still correct in three
        # things go-envelopes does not own, and retiring it flags 48 sites in
        # them:
        #   * Tangent's own persisted vocabularies, whose values are data —
        #     room.envelopeStatusCancelled, roomflow.StatusCancelled, the
        #     progress-panel states. Changing a value here is a data
        #     migration, not a spelling fix, and historyResponseStatus reads
        #     one of them against Tangent's constant on purpose.
        #   * Torque's status vocabulary, surfaced in the torqueboard plugin.
        #     Another application owns that spelling; Tangent transcribes it.
        #   * ordinary English prose in comments and Go identifiers built on
        #     it (room.ErrUserCancelled), where British is a spelling
        #     preference and not a protocol claim.
        #
        # So this is no longer debt with a deadline attached. Retiring it
        # needs a decision about Tangent's own vocabulary, which is a
        # different question from the one CW-20260904-0168 answered.
        - cancelled

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks:
        - "all"
        - "-ST1000"

    unparam:
      check-exported: false

  exclusions:
    generated: lax

    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - unparam

    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
