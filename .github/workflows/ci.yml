name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (lint + build + test)
    runs-on: ubuntu-latest
    env:
      # All hollis-labs modules are public and resolve through the module proxy.
      # The smoke helper fetches the plugins monorepo source pin used locally;
      # tangent-plugins.version separately controls operator installation.
      TANGENT_SMOKE_EXTRA_PLUGINS: github
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node (for envelope codegen and joined browser driver)
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install joined browser driver dependencies
        working-directory: ui
        run: npm ci

      - name: Build embedded production frontend
        working-directory: ui
        run: npm run build

      - name: Go packages
        id: server-packages
        run: |
          # Emitted as ./relative paths, not import paths: go vet/build/test accept either, but
          # golangci-lint resolves its arguments as directories and fails with "directory not
          # found" on an import path.
          packages=$(go list -f '{{.Dir}}' ./... | sed "s#^$PWD#.#" | tr '\n' ' ')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m ${{ steps.server-packages.outputs.packages }}

      # The transport-boundary gate (.golangci.transport.yml), at R3: any
      # finding fails. Transports call the service layer, not internal/db.
      - name: Transport-boundary lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --config .golangci.transport.yml --timeout=5m ${{ steps.server-packages.outputs.packages }}

      - name: go vet
        run: go vet ${{ steps.server-packages.outputs.packages }}

      # The framework's own scanner, not a copy: secret-shaped literals and private paths in the tree.
      - name: Public-readiness scan
        run: go run github.com/hollis-labs/substrate/cmd/substrate scan-public --tree

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/server/ui_dist/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt: unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check envelope types are not stale
        run: make check-envelopes

      - name: Build
        run: go build ${{ steps.server-packages.outputs.packages }}

      - name: Test (race)
        run: go test -race ${{ steps.server-packages.outputs.packages }}

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ui/package-lock.json
            ui/tools/design-lint/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Install design rule tooling
        working-directory: ui/tools/design-lint
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Design rule ratchet
        run: npm run check:design

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run
